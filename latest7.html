const LS0={pw:79,h:25,m:0,g:3,ox:0,bh:11,fs:9,fill:0};
function lsGet(){try{return{...LS0,...JSON.parse(localStorage.getItem('rd_lbl2')||'{}')}}catch(e){return{...LS0}}}
function lsGeom(o){const lw=Math.round(((o.pw-2*o.m-o.g)/2)*100)/100;return{lw,bw:Math.max(5,Math.round((lw-4)*100)/100)}}
function lsSet(k,x){const o=lsGet();x=+x||0;const old=o[k];o[k]=k=='fill'?(x?1:0):k=='ox'?x:(k=='g'||k=='m')?Math.max(0,x):Math.max(1,x||LS0[k]);
if(lsGeom(o).lw<10){o[k]=old;toast('Label would be too narrow. Reduce the gap or margin, or increase the paper width.')}
try{localStorage.setItem('rd_lbl2',JSON.stringify(o))}catch(e){}lbDraw()}
function lab(items){const o=lsGet();LB={items,mode:'one',n:2};const f=(k,t,s)=>`<label>${t} <input type="number" step="${s||'any'}" value="${o[k]}" style="width:66px" onchange="lsSet('${k}',this.value)"></label> `;
ov(`<div class="noprint"><b>Stickers (2 per row: left + right)</b> <select onchange="LB.mode=this.value;lbDraw()"><option value="one">Copies per item</option><option value="qty">One per piece (qty)</option></select> <input type="number" min="1" value="2" style="width:70px" onchange="LB.n=Math.max(1,+this.value||1);lbDraw()"> <label><input type="checkbox" ${o.fill?'checked':''} onchange="lsSet('fill',this.checked?1:0)"> If one label is left over, repeat it on the right side</label><div class="row"><b>Sticker paper:</b> ${f('pw','Paper width mm (both labels)')}${f('h','Label height mm')}${f('m','Side margin mm')}${f('g','Centre gap mm')}${f('ox','Shift mm (+right / -left)','0.1')}${f('bh','Barcode height mm')}${f('fs','Text size px')}<span>Each label = <b id="lbw"></b> mm wide (auto)</span></div><small>Label width and barcode width are calculated from the paper width. Left label = left half, right label = right half, the centre cut line sits exactly between them (red dotted line on screen only). Settings are saved on this computer. In the print dialog set Margins: None, Scale: 100%, and paper size = ${o.pw} x ${o.h} mm (same as the sticker sheet).</small></div><div id="lbx" class="lbs"></div>`,'@page{size:79mm 25mm;margin:0}');lbDraw()}
function lbDraw(){const o=lsGet(),G=lsGeom(o),L=[];LB.items.forEach(it=>{const p=pr(it.pid),n=LB.mode=='qty'?it.q:LB.n;for(let i=0;i<n;i++)L.push(`<div class="lb" style="width:${G.lw}mm;height:${o.h}mm;font-size:${o.fs}px"><div class="nm">${esc(p.name)}</div>${eanSvg(p.bc,G.bw,o.bh)}<div>${p.bc}${p.price?' | '+money(p.price):''}</div></div>`)});
const R=[],cx=o.pw/2+o.ox;for(let i=0;i<L.length;i+=2){const a=L[i],b=L[i+1]||(o.fill?a:'');R.push(`<div class="lr" style="display:grid;grid-template-columns:${G.lw}mm ${G.lw}mm;column-gap:${o.g}mm;justify-content:start;padding-left:${o.m+o.ox}mm;width:${o.pw}mm;height:${o.h}mm;--cx:${cx}mm">${a}${b}</div>`)}
$('pg').textContent=`@page{size:${o.pw}mm ${o.h}mm;margin:0}`;$('lbx').innerHTML=R.join('');if($('lbw'))$('lbw').textContent=G.lw}

/* ---------- Stock out (warehouse marks bill items as gone) ---------- */
async function doOut(no){const i=D.invoices.find(x=>x.id==no);if(!i||sot(i))return toast('Stock already out');
if(!(ME.role=='super'||(ME.role=='warehouse'&&ME.wh==i.wh)))return toast('Not allowed');
const lines=i.lines.map(l=>({pid:l.pid,q:l.q-retQ(i,l.pid)})).filter(l=>l.q>0);
for(const l of lines)if(l.q>sq(i.wh,l.pid))return toast(pr(l.pid).name+': only '+sq(i.wh,l.pid)+' in stock at '+i.wh);
await put('invoices',{...JSON.parse(JSON.stringify(i)),so:{t:iso(),dt:td(),by:ME.id,byName:ME.name,lines}});toast('Stock out done: '+no);render();showInv(no)}
V.out=()=>{const w=ME.wh||OW||WHS[1];OW=w;const P=D.invoices.filter(i=>i.wh==w&&!sot(i)).sort((a,b)=>a.t<b.t?-1:1),Dn=D.invoices.filter(i=>i.wh==w&&i.so).sort((a,b)=>a.so.t<b.so.t?1:-1).slice(0,15);
return`<div class="card"><h3>Bills waiting for stock out</h3><div class="row"><b>Location</b>${ME.wh?'<b>'+w+'</b>':`<select onchange="OW=this.value;render()">${opt(WHS,x=>`<option ${x==w?'selected':''}>${x}</option>`)}</select>`}</div><p class="hint">Open the invoice, check the items, then press Stock Out. Stock leaves the warehouse ledger only when you do this.</p>${T(['Invoice','Date','Customer','By','Pieces',''],P.map(i=>[i.id,fd(i.t),esc(i.cname),esc(i.byName),i.lines.reduce((x,l)=>x+l.q-retQ(i,l.pid),0),`<button class="p" onclick="showInv('${i.id}')">Open</button>`]))}</div><div class="card"><h3>Recently stocked out</h3>${T(['Invoice','Customer','Stock out','By',''],Dn.map(i=>[i.id,esc(i.cname),fd(i.so.t),esc(i.so.byName),`<button onclick="showInv('${i.id}')">Open</button>`]))}</div>`};

toast('Done: '+made+' items created, '+pcs+' pieces added to '+wh+'. Set selling prices in Stock Search.')}catch(e){toast('Import stopped: '+(e.message||e))}
render()}
/* ---------- Admin (super user) ---------- */
V.adm=()=>{const d=DT2||td(),P=D.payments.filter(p=>p.dt==d),A=P.filter(p=>!p.void),sm=m=>A.filter(p=>p.m==m).reduce((s,p)=>s+p.a,0),cc=D.adjusts.find(a=>a.id=='CASH-'+d);
return`<div class="card"><h3>Users</h3><div class="row"><input id="nn" placeholder="Name"><input id="ni" placeholder="Login ID"><input id="np" placeholder="PIN"><select id="nr"><option value="sales">Sales</option><option value="cashier">Cashier</option><option value="warehouse">Warehouse</option><option value="super">Super user</option></select><select id="nw"><option value="">No location</option>${opt(WHS,w=>`<option>${w}</option>`)}</select><button class="p" onclick="addUser()">Create ID</button></div>
${T(['Name','ID','Role','Location',''],D.users.map(u=>[esc(u.name),u.id,u.role,u.wh||'-',`<button onclick="newPin('${u.id}')">Set PIN</button> <button onclick="rmUser('${u.id}',this)">Remove</button>`]))}<div class="row"><input id="pp" placeholder="New PIN to set (type, then press Set PIN)"></div></div>
<div class="card"><h3>Stock reconcile (physical count)</h3><div class="row"><select id="rw" onchange="recShow()">${opt(WHS,w=>`<option>${w}</option>`)}</select><input id="rp" placeholder="Barcode or item name" oninput="recShow()"><input id="rc" type="number" min="0" placeholder="Physical count"><input id="rr" placeholder="Remarks"><button class="p" onclick="recApply()">Reconcile</button></div><p id="rsys" class="hint">System stock shows when you pick an item.</p></div>
<div class="card"><h3>Replace all stock with purchase invoices 432, 433, 571, 712</h3><p class="hint">Deletes the stock already added (stock-in entries, transfers, count corrections) and adds the 4 purchase invoices instead. Bills, payments and customers are NOT touched.</p><div class="row"><b>Add stock to</b><select id="ipw">${opt(WHS,(w,i)=>`<option ${i==1?'selected':''}>${w}</option>`)}</select><label><input type="checkbox" id="ipd" checked> Subtract damaged pieces</label><label><input type="checkbox" id="ipp" checked> Also delete old items that are not on any bill</label></div><div class="row"><button class="p" onclick="impStock(this)">Replace stock</button><small id="ipx"></small></div></div>
<div class="card"><h3>Payment reconcile</h3><div class="row"><input type="date" id="pd" value="${d}" onchange="DT2=this.value;render()"></div>${T(['Receipt','Invoice','Customer','Method','Amount','By',''],P.map(p=>[p.id,p.inv||'On account',esc(pcn(p)),p.m,p.void?'<s>'+money(p.a)+'</s> VOID':money(p.a),esc(p.byName),p.void?'':`<button onclick="voidPay('${p.id}',this)">Void</button>`]))}<p>Cash ${money(sm('Cash'))} | Online ${money(sm('Online'))} | Cheque ${money(sm('Cheque'))}</p><div class="row"><input id="cc" type="number" placeholder="Counted cash" value="${cc?cc.counted:''}"><button class="p" onclick="saveCash('${d}',${sm('Cash')})">Save count</button>${cc?`<span>Recorded difference: ${money(cc.counted-cc.exp)}</span>`:''}</div></div>
<div class="card"><button onclick="backup()">Backup data (copy text)</button></div>`};
async function addUser(){const id=v('ni').trim().toLowerCase().replace(/[^a-z0-9]/g,''),r=v('nr'),w=v('nw');if(!id||!v('nn').trim()||v('np').length<4)return toast('Name, ID and a PIN of 4 or more characters');if(D.users.find(u=>u.id==id))return toast('ID already exists');if(['sales','warehouse'].includes(r)&&!w)return toast('Choose a location');await put('users',{id,name:v('nn').trim(),role:r,wh:w,pin:await hp(v('np'))});toast('ID created');render()}
async function newPin(id){if(v('pp').length<4)return toast('Type the new PIN (4 or more) in the box below, then press Set PIN');await put('users',{...D.users.find(u=>u.id==id),pin:await hp(v('pp'))});toast('PIN changed');render()}
async function rmUser(id,b){if(id==ME.id)return toast('You cannot remove yourself');if(!b.dataset.s){b.dataset.s=1;b.textContent='Click again';return}await del('users',id);render()}
function recShow(){const p=fp(v('rp')),w=v('rw');$('rsys').innerHTML=p?'<b>'+esc(p.name)+'</b> - system stock at '+w+': <b>'+sq(w,p.id)+'</b>':'Item not found'}
const fp=q=>{q=q.trim();return q?D.products.find(p=>p.bc==q)||D.products.find(p=>p.name.toLowerCase()==q.toLowerCase())||D.products.find(p=>p.name.toLowerCase().includes(q.toLowerCase())):null};
async function recApply(){const p=fp(v('rp')),w=v('rw');if(!p||v('rc')==='')return toast('Pick item and enter physical count');const sy=sq(w,p.id),ph=N('rc'),df=ph-sy;if(!df)return toast('Already matches');await put('adjusts',{id:nxt(D.adjusts,'ADJ-',4),wh:w,pid:p.id,diff:df,sys:sy,phys:ph,note:v('rr'),by:ME.id,byName:ME.name,t:iso(),dt:td()});toast('Stock corrected by '+df);render()}
async function voidPay(id,b){if(!b.dataset.s){b.dataset.s=1;b.textContent='Click again to void';return}await put('payments',{...D.payments.find(p=>p.id==id),void:true,voidBy:ME.id});render()}
async function saveCash(d,exp){if(v('cc')==='')return toast('Enter counted cash');await put('adjusts',{id:'CASH-'+d,k:'cash',dt:d,counted:N('cc'),exp,by:ME.id,byName:ME.name,t:iso()});render()}
function backup(){ov('<h3>Backup</h3><p>Select all and copy this text, then keep it in a safe place.</p><textarea style="width:100%;height:60vh">'+esc(JSON.stringify(D))+'</textarea>')}
init();
</script></body></html>
